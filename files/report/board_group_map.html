/* ── Stats ── */
const boardIds  = new Set(DATA.map(r => r.board_id));
const mappedIds = new Set(DATA.filter(r => r.asp_board).map(r => r.board_id));
document.getElementById('s-boards').textContent  = boardIds.size;
document.getElementById('s-groups').textContent  = DATA.length;
document.getElementById('s-mapped').textContent  = mappedIds.size;
document.getElementById('s-unmapped').textContent = boardIds.size - mappedIds.size;
document.getElementById('section-sub').textContent =
  DATA.length + ' groups across ' + boardIds.size + ' boards';
document.getElementById('gen-time').textContent =
  'Generated ' + new Date().toLocaleString();
document.getElementById('row-count').textContent = DATA.length + ' groups';

/* ── Render table ── */
function fmtDate(iso) {
  return iso ? iso.slice(0, 16).replace('T', ' ') : '—';
}

function render(data) {
  const tbody = document.getElementById('tbody');
  let html = '';
  let prevBoard = null;
  data.forEach((r, i) => {
    const isFirst = r.board_id !== prevBoard;
    prevBoard = r.board_id;
    const cls = isFirst ? 'group-first' : '';
    html += `<tr class="${cls}" data-board="${(r.asp_board||'').toLowerCase()}" data-group="${(r.group_title||'').toLowerCase()}" data-bid="${r.board_id}">`;
    html += `<td class="mono muted">${i + 1}</td>`;
    if (isFirst) {
      html += `<td class="asp-cell">${r.asp_board ? r.asp_board : '<span class="badge badge-red">— unmapped —</span>'}</td>`;
      html += `<td style="font-size:12px" class="muted">${r.operation_support || '—'}</td>`;
      html += `<td class="mono muted">${r.board_id}</td>`;
    } else {
      html += `<td class="asp-cont">${r.asp_board || ''}</td><td></td><td></td>`;
    }
    html += `<td>${r.group_title || '—'}</td>`;
    html += `<td class="mono">${r.items_count != null ? r.items_count.toLocaleString() : '—'}</td>`;
    html += `<td style="font-size:12px" class="muted">${fmtDate(r.counted_at)}</td>`;
    html += '</tr>';
  });
  tbody.innerHTML = html || '<tr><td colspan="7" style="text-align:center;padding:32px;color:#57606a">No data.</td></tr>';
}

render(DATA);

/* ── Search ── */
document.getElementById('srch').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  const rows = document.querySelectorAll('#tbody tr[data-bid]');
  let visible = 0;
  rows.forEach(row => {
    const show = !q || row.dataset.board.includes(q) || row.dataset.group.includes(q);
    row.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  // Re-mark group-first on first visible row per board
  const seenBoards = new Set();
  rows.forEach(row => {
    if (row.classList.contains('hidden')) return;
    const bid = row.dataset.bid;
    if (!seenBoards.has(bid)) { row.classList.add('group-first'); seenBoards.add(bid); }
    else row.classList.remove('group-first');
  });
  document.getElementById('row-count').textContent = visible + ' group' + (visible !== 1 ? 's' : '');
});

/* ── Export CSV ── */
function exportCSV() {
  const cols = ['board_id','asp_board','operation_support','group_id','group_title','items_count','counted_at'];
  const lines = [cols.join(',')];
  DATA.forEach(r => {
    lines.push(cols.map(c => {
      const v = r[c] == null ? '' : String(r[c]);
      return v.includes(',') || v.includes('"') ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'board_group_map.csv';
  a.click();
}
